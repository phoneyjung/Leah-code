    <div class="row end"><button class="btn-soft" data-act="edback">${ICON.pen}${tx('แก้ด่านต่อ','Keep editing')}</button><button class="btn-gold" data-act="sharepub">${ICON.share}${tx('แชร์ให้เพื่อน','Share with a friend')}</button></div></div>`);
  speak(fresh.length?'sticker':'ed_ready');
}
function levelUrl(code,sol,by){return location.origin+location.pathname+'#play='+encodeURIComponent(code)+'&s='+encodeURIComponent(sol||'')+'&by='+encodeURIComponent(by||'')}
async function shareLevel(code,sol,by){
  const url=levelUrl(code,sol,by),text=tx(`ลองเล่นด่านที่${by||'เพื่อน'}สร้างในเกมลีอากับการ์ดเวทมนตร์ ได้ 3 ดาวไหม`,`Try the level ${by||'a friend'} made in Leah and the Magic Cards. Can you get 3 stars?`);
  try{if(navigator.share){await navigator.share({title:tx('ด่านจากเพื่อน','A level from a friend'),text,url});return}}catch(e){return}
  try{await navigator.clipboard.writeText(url);toast(tx('คัดลอกลิงก์ด่านแล้ว ส่งให้เพื่อนได้เลย','Level link copied. Send it to a friend!'))}catch(e){window.prompt(tx('คัดลอกลิงก์นี้','Copy this link'),url)}
}
function miniMap(dd){return `<div class="mine-mini" style="grid-template-columns:repeat(${dd.w},1fr)">${dd.rows.join('').split('').map(c=>`<i class="${{'#':'w','*':'s','?':'q','H':'h','C':'c'}[c]||''}"></i>`).join('')}</div>`}
function openMine(){
  if(!S.mine.length)return edWarn('ed_none');
  sheet(`<div class="mine"><div class="win-title small">${tx('ด่านของฉัน','My levels')}</div>${S.mine.map((d,i)=>{const dd=decodeLevel(d.code);if(!dd)return '';const best=S.friend[d.code]||0;
    return `<div class="mine-row">${miniMap(dd)}<div class="mine-txt"><b>${WORLDS[dd.theme-1].name} ${dd.w}×${dd.h}</b><span>${tx(`เป้า 3 ดาว ${dd.par} ใบ`,`3 stars: ${dd.par} cards`)}${best?tx(`, ได้ ${best} ดาว`,`, you got ${best}`):''}</span></div><button class="ctl sm" data-act="mine-play" data-i="${i}" aria-label="${tx('เล่นด่านนี้','Play this level')}">${ICON.play}</button><button class="ctl sm" data-act="mine-share" data-i="${i}" aria-label="${tx('แชร์ด่านนี้','Share this level')}">${ICON.share}</button><button class="ctl sm" data-act="mine-edit" data-i="${i}" aria-label="${tx('แก้ด่านนี้','Edit this level')}">${ICON.pen}</button><button class="ctl sm" data-act="mine-del" data-i="${i}" aria-label="${tx('ลบด่านนี้','Delete this level')}">${ICON.trash}</button></div>`}).join('')}
    <div class="row end"><button class="btn-gold" data-act="close">${tx('ปิด','Close')}</button></div></div>`,true);
}
function openEdHelp(){
  sheet(tx(`<div><div class="win-title small">สร้างด่านเอง</div><ol class="help-steps"><li>แตะเครื่องมือ แล้วแตะช่องบนกระดานเพื่อวาง แตะซ้ำเพื่อเอาออก</li><li>เลือกขนาด ฉาก และชุดการ์ดที่เพื่อนจะได้ใช้</li><li>กดลองเล่นแล้วเล่นให้ผ่าน จำนวนการ์ดที่ใช้จะเป็นเป้า 3 ดาว</li><li>กดแชร์ให้เพื่อน ส่งลิงก์ทางไลน์หรือแชตได้เลย</li></ol><div class="row end"><button class="btn-gold" data-act="close">เข้าใจแล้ว</button></div></div>`,`<div><div class="win-title small">Make a Level</div><ol class="help-steps"><li>Tap a tool, then tap a square on the board to place it. Tap again to take it away.</li><li>Pick the size, the scene, and the cards your friend can use.</li><li>Tap Test Play and win it. The number of cards you use becomes the 3-star goal.</li><li>Tap Share with a friend and send the link in a chat.</li></ol><div class="row end"><button class="btn-gold" data-act="close">Got it</button></div></div>`),true);
}
function openCustomHelp(){
  const lv=P.lv;sheet(`<div><div class="win-title small">${lv.custom==='test'?tx('ลองเล่นด่านของตัวเอง','Test your level'):tx('ด่านจากเพื่อน','A level from a friend')}</div><p class="p">${lv.custom==='test'?tx('เล่นให้ผ่านก่อน จำนวนการ์ดที่ใช้จะเป็นเป้า 3 ดาวของเพื่อน','Win it first. The number of cards you use becomes your friend’s 3-star goal.'):VOICE.k_go}</p><div class="intro-cards" style="justify-content:center">${lv.cards.map(t=>`<div class="ic"><div class="card k-${t}">${CARDS[t].icon}</div><span>${CARDS[t].name}</span></div>`).join('')}</div><div class="row end"><button class="btn-gold" data-act="close">${tx('เข้าใจแล้ว','Got it')}</button></div></div>`,true);
}
/* เปิดลิงก์ด่านที่เพื่อนส่งมา (#play=...) */
function openFromHash(){
  const h=location.hash;if(!h.startsWith('#play='))return false;
  const ps=new URLSearchParams(h.slice(1)),code=ps.get('play')||'',d=decodeLevel(code);
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  if(!d){toast(tx('ลิงก์ด่านนี้เปิดไม่ได้','This level link doesn’t work'));return false}
  const by=(ps.get('by')||'').trim().slice(0,12),sol=(ps.get('s')||'').slice(0,80);
  const lvx=customLevel(d.rows,d.theme,d.tier,{mode:'friend',code,by,par:d.par,sol});
  if(!lvx.solP){toast(tx('ลิงก์ด่านนี้เปิดไม่ได้','This level link doesn’t work'));return false}
  openFromHash.lv=lvx;d.par=lvx.par;
  const who=by?esc(by):tx('เพื่อน','a friend'),Who=by?esc(by):tx('เพื่อน','A friend');
  sheet(`<div class="friend"><div class="wd-art"><div>${heroArt()}</div><div class="wd-star">${A.star()}</div><div>${petArt()}</div></div><div class="win-title small">${tx(`ด่านจาก${who}`,`A level from ${who}`)}</div><p class="p">${tx(`${who}สร้างด่านนี้มาให้ ใช้การ์ดไม่เกิน ${d.par} ใบจะได้ 3 ดาว`,`${Who} made this level for you. Use ${d.par} cards or fewer to get 3 stars.`)}</p><div class="row end"><button class="btn-soft" data-act="home">${tx('ไว้ทีหลัง','Later')}</button><button class="btn-gold" data-act="friendgo">${tx('เล่นเลย','Play now')}${ICON.next}</button></div></div>`);
  speak('friend');return true;
}
$('#edBoard').addEventListener('click',e=>{const c=e.target.closest('[data-x]');if(c)edTap(+c.dataset.x,+c.dataset.y)});
$('#edTools').addEventListener('click',e=>{const b=e.target.closest('[data-tool]');if(b){E.tool=b.dataset.tool;SFX.tap();renderEditor()}});
$('#edit .ed-panel').addEventListener('click',e=>{
  const b=e.target.closest('[data-ed],[data-tier],[data-size]');if(!b)return;
  if(b.dataset.tier){E.tier=+b.dataset.tier;SFX.tap();return renderEditor()}
  if(b.dataset.size){const [w,h]=b.dataset.size.split('x').map(Number);return edResize(w,h)}
  const v=b.dataset.ed;if(v==='w-')edResize(E.w-1,E.h);else if(v==='w+')edResize(E.w+1,E.h);else if(v==='h-')edResize(E.w,E.h-1);else if(v==='h+')edResize(E.w,E.h+1);
  else if(v==='t-'||v==='t+'){E.theme=(E.theme+(v==='t+'?0:6))%8+1;SFX.tap();renderEditor()}
});
$('#edMine').onclick=()=>{SFX.tap();openMine()};
$('#edTest').onclick=()=>{ac();SFX.tap();edTest()};
$('#edClear').onclick=()=>{const b=$('#edClear');if(!b.classList.contains('confirm')){b.classList.add('confirm');b.querySelector('span').textContent=tx('แตะอีกที','Tap again');clearTimeout(openEditor.t);openEditor.t=setTimeout(()=>{if(E)renderEditor()},2200);return}E=newEd(E.w,E.h,E.theme,E.tier);SFX.tap();renderEditor()};
$('#edBack').onclick=()=>{stopVoice();show('map');renderMap()};
$('#edHelp').onclick=()=>{SFX.tap();openEdHelp()};
$('#edSay').onclick=()=>{ac();if(edSay.cur)speak(edSay.cur)};
window.addEventListener('hashchange',openFromHash);

/* ---------- ปุ่มและการแตะ ---------- */
$('#ov').addEventListener('click',e=>{if(e.target===$('#ov')&&$('#ov').dataset.dismiss){closeSheet();return}const b=e.target.closest('[data-act]');if(!b)return;SFX.tap();act(b.dataset.act,b)});
$('#palette').addEventListener('click',e=>{const b=e.target.closest('[data-add]');if(b)addCard(b.dataset.add)});
$('#prog').addEventListener('click',e=>{
  const sa=e.target.closest('[data-scroll]');if(sa){const sc=sa.parentElement.querySelector('.strip-cards');sc.scrollBy({left:+sa.dataset.scroll*sc.clientWidth*.7,behavior:'smooth'});SFX.tap();return}
  if(!P||P.running||P.won||P.lv.kind==='step')return;
  const t=e.target.closest('[data-lcount],[data-lhead],[data-id],[data-slot],[data-strip]');if(!t)return;SFX.tap();
  if(t.dataset.lcount){const L=locate(t.dataset.lcount);if(L){snap();L.nd.n=L.nd.n>=6?2:L.nd.n+1;P.sel=null;afterEdit()}return}
  if(t.dataset.lhead){P.sel=P.sel===t.dataset.lhead?null:t.dataset.lhead;renderProg();renderCtrls();return}
  if(t.dataset.id){P.sel=P.sel===t.dataset.id?null:t.dataset.id;renderProg();renderCtrls();return}
  if(t.dataset.slot){const v=t.dataset.slot;if(v.startsWith('loop:')){const id=v.slice(5),L=locate(id);P.target={s:L?L.s:'main',loop:id}}else P.target={s:v,loop:null};P.sel=null;renderProg();renderCtrls();return}
  if(t.dataset.strip){P.target={s:t.dataset.strip,loop:null};P.sel=null;renderProg();renderCtrls()}
});
$('#btnUndo').onclick=undo;$('#btnClear').onclick=clearAll;$('#btnRun').onclick=runProgram;
$('#btnBack').onclick=()=>{stopVoice();if(P&&(P.lv.custom==='test'||P.lv.own))openEditor();else if(P&&P.lv.custom){show('home');renderHome()}else{show('map');renderMap()}};
$('#btnSay').onclick=$('#lvName').onclick=()=>{if(P){ac();levelSay()}};
$('#btnHelp').onclick=()=>{if(!P||P.running)return;P.lv.custom?openCustomHelp():openIntro(P.lv.w)};
$('#btnHint').onclick=openHint;
$('#demoSkip').onclick=()=>{const b=demoSkipTo||demoBack;demoBack=demoSkipTo=null;stopDemo();b?b():(show('map'),renderMap())};
$('#btnSpeed').onclick=()=>{S.fast=!S.fast;save();renderSpeed();toast(S.fast?tx('เดินเร็ว (กระต่าย)','Fast (rabbit)'):tx('เดินช้า (เต่า)','Slow (turtle)'))};
$('#say').onclick=()=>{ac();if(say.cur)speak(say.cur)};
$('#mapHome').onclick=()=>{show('home');renderHome()};
$('#worlds').addEventListener('click',e=>{const dm=e.target.closest('[data-demo]');if(dm){SFX.tap();ac();const wi=+dm.dataset.demo.slice(1)-1,toMap=()=>{show('map');renderMap()};runDemo(dm.dataset.demo,()=>{const l=ALL.find(x=>x.wi===wi&&!done(x.id))||ALL.find(x=>x.wi===wi);startLevel(l.idx)},toMap);return}
  const sp=e.target.closest('[data-sp]');if(sp){SFX.tap();sp.dataset.sp==='make'?openEditor():openStickers();return}
  const b=e.target.closest('[data-lv]');if(b&&!b.disabled){SFX.tap();startLevel(+b.dataset.lv)}});
let welcomed=false;
$$('.ava').forEach(b=>b.onclick=()=>{ac();S.ava=b.dataset.ava;save();renderHome();SFX.tap();if(!welcomed){welcomed=true;speak('welcome')}});
$$('.pet').forEach(b=>b.onclick=()=>{ac();S.pet=b.dataset.pet;applyPet();save();renderHome();SFX.tap();welcomed=true;speak('pet_pick')});
$('#nameIn').addEventListener('input',e=>{S.name=e.target.value.slice(0,12);save()});
$$('.lang-opt[data-lang]').forEach(b=>b.onclick=()=>{ac();SFX.tap();setLang(b.dataset.lang)});
/* ข้อความใน HTML ตามภาษา */
function applyLang(){
  document.documentElement.lang=S.lang;document.title=T('title');
  $$('[data-t]').forEach(e=>{e.innerHTML=T(e.dataset.t)});
  $$('[data-ta]').forEach(e=>e.setAttribute('aria-label',T(e.dataset.ta)));
  $$('[data-tp]').forEach(e=>e.setAttribute('placeholder',T(e.dataset.tp)));
  $('#demoSkip').innerHTML=ICON.back+`<span>${T('demo_skip')}</span>`;
  applyPet();
}
/* เปลี่ยนภาษาแล้ววาดหน้าที่เปิดอยู่ใหม่ทันที ไม่ต้องโหลดใหม่ */
function setLang(l){
  if((l!=='th'&&l!=='en')||l===S.lang)return;S.lang=l;save();stopVoice();applyLang();
  const on=id=>$('#'+id).classList.contains('on');
  if(on('home'))renderHome();
  if(on('map'))renderMap();
  if(on('play')&&P){renderHud();renderPalette();if(!P.running){renderProg();renderCtrls()}
    if(say.cur&&VOICE[say.cur])$('#sayText').textContent=VOICE[say.cur];requestAnimationFrame(layout)}
  if(on('edit')&&E){renderEditor();if(edSay.cur&&VOICE[edSay.cur])$('#edSayText').textContent=VOICE[edSay.cur]}
  if(!$('#ov').hidden&&$('#sheet .seg.lang'))openParent();
}
$('#btnPlay').onclick=()=>{ac();SFX.tap();
  const go=()=>{if(!ALL.some(l=>done(l.id)))startLevel(0);else{show('map');renderMap()}};
  if(!S.seen.video){S.seen.video=1;save();tryVideo(vidOf('intro'),go)}else go();
};
$('#btnMap').onclick=()=>{SFX.tap();show('map');renderMap()};
$('#btnParent').onclick=()=>openGate(openParent);
$('#btnShare').onclick=async()=>{
  const url=location.href.split('#')[0].split('?')[0],data={title:T('title'),text:tx('เกมฝึกโค้ดดิ้งสำหรับเด็ก 5–10 ขวบ ลองเล่นกัน','A coding game for kids 5–10. Let’s play!'),url};
  try{if(navigator.share){await navigator.share(data);return}}catch(e){return}
  try{await navigator.clipboard.writeText(url);toast(tx('คัดลอกลิงก์แล้ว ส่งให้เพื่อนได้เลย','Link copied. Send it to a friend!'))}catch(e){window.prompt(tx('คัดลอกลิงก์นี้','Copy this link'),url)}
};
let installEvt=null;
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(!standalone())$('#btnInstall').hidden=false});
window.addEventListener('appinstalled',()=>{$('#btnInstall').hidden=true;toast(tx('ติดตั้งแล้ว ดูไอคอนที่หน้าจอได้เลย','Installed! Look for the icon on your screen.'))});
if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!standalone())$('#btnInstall').hidden=false;
$('#btnInstall').onclick=async()=>{
  if(installEvt){installEvt.prompt();try{await installEvt.userChoice}catch(e){}installEvt=null;$('#btnInstall').hidden=true}
  else sheet(tx(`<div><div class="win-title small">ติดตั้งเป็นแอป</div><p class="p">บน iPhone/iPad: แตะปุ่มแชร์ด้านล่างของ Safari แล้วเลือก "เพิ่มไปยังหน้าจอโฮม"</p><p class="p">บน Android: แตะเมนู ⋮ ของ Chrome แล้วเลือก "ติดตั้งแอป" หรือ "เพิ่มลงในหน้าจอหลัก"</p><div class="row"><button class="btn-gold" data-act="close">เข้าใจแล้ว</button></div></div>`,`<div><div class="win-title small">Install as an app</div><p class="p">On iPhone/iPad: tap the Share button at the bottom of Safari, then choose "Add to Home Screen".</p><p class="p">On Android: tap the ⋮ menu in Chrome, then choose "Install app" or "Add to Home screen".</p><div class="row"><button class="btn-gold" data-act="close">Got it</button></div></div>`));
};
document.addEventListener('keydown',e=>{
  if(!$('#play').classList.contains('on')||!$('#ov').hidden||e.target.tagName==='INPUT'||!$('#demoLayer').hidden)return;
  const map={ArrowUp:'U',ArrowDown:'D',ArrowLeft:'L',ArrowRight:'R'};
  if(map[e.key]&&P.lv.cards.includes(map[e.key])){e.preventDefault();addCard(map[e.key])}
  else if(e.key==='Enter'||e.key===' '){e.preventDefault();runProgram()}
  else if(e.key==='Backspace'){e.preventDefault();undo()}
});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{layout();if($('#edit').classList.contains('on'))renderEditor()},80)});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopVoice()});

/* ---------- เริ่มเกม ---------- */
['#btnBack','#btnSay','#btnHelp','#btnHint','#mapHome','#sayIc','#edBack','#edHelp','#edSayIc'].forEach((s,i)=>$(s).innerHTML=[ICON.back,ICON.speak,ICON.help,ICON.bulb,ICON.home,ICON.speak,ICON.back,ICON.help,ICON.speak][i]);
applyLang();awardStickers();save();
renderHome();show('home');openFromHash();
probeAssets().then(()=>{renderHome();if(P&&$('#play').classList.contains('on')){renderBoard()}});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
