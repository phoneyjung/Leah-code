<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ลีอากับการ์ดเวทมนตร์</title>
<meta name="description" content="เกมฝึกคิดแบบโปรแกรมเมอร์สำหรับเด็ก 5–10 ขวบ เรียงการ์ดคาถาพาไปหาน้องหมา">
<meta name="theme-color" content="#8E7CC3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="การ์ดเวทมนตร์">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ระบบสี 60-30-10: ครีม 60% · ม่วงพ่อมด 30% · ทองดาว 10% */
:root{
  --cream:#FFF6E9; --cream2:#F8EBD6; --stone:#E8D9C0;
  --purple:#8E7CC3; --purple-d:#6A58B0; --purple-dd:#5B4A9B; --purple-l:#CFC6EE; --purple-ll:#ECE8F8;
  --gold:#FFB627; --gold-d:#E39A00; --ink:#3D2C5A; --peach:#FF8A7A;
  --c:56px; --cs:44px; --cp:56px; --spd:600ms;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px); --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--cream);color:var(--ink);font-family:'Mali','Sarabun','Noto Sans Thai',system-ui,sans-serif;font-weight:600;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none;touch-action:manipulation;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{cursor:default}
svg{display:block}
.screen{position:fixed;inset:0;display:none;padding:calc(8px + var(--st)) calc(8px + var(--sr)) calc(8px + var(--sb)) calc(8px + var(--sl))}
.screen.on{display:flex}

/* ปุ่มพื้นฐาน */
.btn-gold{background:var(--gold);color:var(--ink);border-radius:999px;padding:12px 26px;font-size:20px;font-weight:700;box-shadow:0 5px 0 var(--gold-d);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s,box-shadow .08s}
.btn-gold:active{transform:translateY(4px);box-shadow:0 1px 0 var(--gold-d)}
.btn-gold svg{width:22px;height:22px}
.btn-soft{background:var(--purple-ll);color:var(--purple-dd);border-radius:999px;padding:11px 20px;font-size:17px;box-shadow:0 4px 0 var(--purple-l);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-soft:active{transform:translateY(3px);box-shadow:0 1px 0 var(--purple-l)}
.btn-soft svg{width:20px;height:20px}
.btn-soft.sm{padding:8px 14px;font-size:15px}
.btn-soft.danger{color:#B4483C}
.chip{background:#fff;border:2px solid var(--purple-l);color:var(--purple-dd);border-radius:999px;padding:7px 14px;font-size:15px;min-height:42px}
.icon-btn{width:44px;height:44px;flex:0 0 44px;border-radius:14px;display:grid;place-items:center;background:var(--purple-ll);color:var(--purple-dd)}
.icon-btn svg{width:24px;height:24px}
.icon-btn.on{background:var(--purple);color:#fff}
.icon-btn.hint{background:#fff;color:var(--gold-d);box-shadow:0 0 0 2px var(--gold) inset;animation:pulse 1.6s infinite}

/* หน้าแรก */
#home{align-items:center;justify-content:center}
.home-wrap{display:flex;width:100%;max-width:1040px;height:100%;align-items:center;gap:12px}
.home-art{flex:0 0 61.8%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:0}
.home-side{flex:1;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;min-width:0;max-height:100%;overflow-y:auto;padding:4px 0}
.stage-oval{position:relative;width:min(100%,560px);aspect-ratio:1.618;border-radius:50% 50% 46% 46%/60% 60% 40% 40%;background:radial-gradient(ellipse at 50% 85%,#E5DDF6 0 55%,transparent 56%);display:flex;align-items:flex-end;justify-content:center;gap:2%}
.stage-oval .a-wiz{width:36%;margin-bottom:6%}
.stage-oval .a-hero{width:27%;margin-bottom:3%}
.stage-oval .a-cat{width:23%;margin-bottom:3%}
.stage-oval .a-star{position:absolute;width:11%;right:14%;top:6%;animation:float 3s ease-in-out infinite}
.title-img{max-width:100%;max-height:100%;object-fit:contain;border-radius:24px}
.fan{display:flex;gap:10px;justify-content:center}
.fan .card{--cs:50px}
.fan .card:nth-child(1){transform:rotate(-9deg) translateY(4px)}
.fan .card:nth-child(2){transform:rotate(-3deg)}
.fan .card:nth-child(3){transform:rotate(3deg)}
.fan .card:nth-child(4){transform:rotate(9deg) translateY(4px)}
.title{font-size:clamp(28px,4.6vw,46px);line-height:1.12;margin:0;color:var(--purple-dd);font-weight:700}
.title small{display:block;font-size:.5em;color:var(--ink);font-weight:600;margin-bottom:2px}
.sub{margin:0;font-size:16px;color:var(--purple-d)}
.who{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.ava{width:64px;height:64px;border-radius:20px;background:var(--purple-ll);border:3px solid transparent;padding:3px}
.ava.sel{border-color:var(--purple);background:#fff}
.ava svg,.ava img{width:100%;height:100%}
.pets{display:flex;gap:10px;align-items:center;justify-content:center;color:var(--purple-d);font-size:16px}
.pet{width:64px;height:64px;border-radius:20px;background:var(--purple-ll);border:3px solid transparent;padding:2px 3px 0;position:relative;display:flex;flex-direction:column;align-items:center;overflow:hidden}
.pet svg,.pet img{width:76%;height:76%;flex:0 0 auto}
.pet span{font-size:11px;line-height:1.1;color:var(--purple-dd);white-space:nowrap;margin-top:-3px}
.pet.sel{border-color:var(--purple);background:#fff}
#nameIn{width:150px;height:52px;border-radius:16px;border:3px solid var(--purple-l);background:#fff;font:inherit;font-size:19px;text-align:center;color:var(--ink);-webkit-user-select:text;user-select:text}
#btnPlay{font-size:24px;padding:14px 40px}
.home-tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
@media (orientation:portrait){.home-wrap{flex-direction:column;justify-content:center}.home-art{flex:0 0 auto;height:auto;width:100%}.stage-oval{width:min(100%,420px)}}
@media (max-height:340px){.title small{display:none}.title{font-size:22px!important}.ava,.pet{width:46px!important;height:46px!important}.pet span{display:none}#nameIn{height:40px!important;width:120px}#btnPlay{font-size:18px!important;padding:8px 24px!important}.home-tools .chip{font-size:13px!important;padding:4px 10px!important}.home-side{gap:6px!important}.home-wrap{gap:6px}}
@media (max-height:420px){.intro-face{width:72px;flex-basis:72px}.intro-idea{font-size:20px}.p{font-size:15px;margin:4px 0}.ic .card{--cs:44px}.win-title{font-size:24px}.bs{width:58px;height:58px}.sheet{padding:14px 18px}.sheet .row.end{bottom:-14px;padding-bottom:10px;margin-bottom:-10px}}
@media (max-height:420px){.fan{display:none}.title{font-size:26px}.title small{font-size:13px}.sub{display:none}.home-side{gap:8px}.ava{width:54px;height:54px;border-radius:16px}#nameIn{height:44px}.pet{width:54px;height:54px;border-radius:16px}#btnPlay{font-size:21px;padding:10px 30px}.chip{padding:5px 12px;font-size:14px}}

/* แผนที่ */
#map{flex-direction:column;gap:8px}
.bar{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.bar-title{flex:1;font-size:22px;font-weight:700}
.total{background:#fff;border-radius:999px;padding:6px 14px;display:flex;align-items:center;gap:6px;font-size:17px;box-shadow:0 0 0 2px var(--purple-ll) inset}
.total svg{width:20px;height:20px}
.worlds{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));grid-auto-rows:max-content;gap:10px;padding:2px 2px 24px;align-content:start}
.world{background:#fff;border-radius:22px;padding:12px 12px 12px 20px;box-shadow:inset 8px 0 0 var(--wc),inset 0 0 0 2px var(--purple-ll)}
.w-head{display:flex;align-items:center;gap:10px}
.w-ico{width:44px;height:44px;flex:0 0 44px;background:var(--wt);border-radius:12px;padding:3px}
.w-txt{flex:1;min-width:0}
.w-name{font-size:19px;font-weight:700}
.w-idea{font-size:14px;color:var(--purple-d)}
.w-stars{display:flex;align-items:center;gap:4px;font-size:15px;color:var(--purple-d)}
.w-stars svg{width:18px;height:18px}
.w-lvls{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.lv{width:58px;height:64px;border-radius:18px;background:var(--purple-ll);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--purple-dd);box-shadow:0 4px 0 var(--purple-l)}
.lv:active{transform:translateY(3px);box-shadow:0 1px 0 var(--purple-l)}
.lv-n{font-size:21px;line-height:1}
.lv-n svg{width:20px;height:20px}
.lv-s{display:flex;gap:1px}
.lv-s i,.g-stars i{width:13px;height:13px;background:var(--purple-l);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.lv-s i.on,.g-stars i.on{background:var(--gold)}
.lv.done{background:var(--purple);color:#fff;box-shadow:0 4px 0 var(--purple-dd)}
.lv.done .lv-s i:not(.on){background:#ffffff55}
.lv{position:relative}
.lv.fresh::after{content:'ใหม่';position:absolute;top:-7px;right:-6px;background:var(--peach);color:#fff;font-size:11px;line-height:1;padding:3px 5px 4px;border-radius:999px}
html[lang=en] .lv.fresh::after{content:'New'}
.lv.next{box-shadow:0 0 0 3px var(--gold),0 4px 0 var(--purple-l);animation:breathe 1.8s ease-in-out infinite}
.lv.lock{opacity:.55;box-shadow:none}
.world.locked{opacity:.75}

/* หน้าเล่น */
#play{gap:8px}
.stage{flex:0 0 calc(61.8% - 4px);display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.panel{flex:1 1 38.2%;display:flex;flex-direction:column;gap:6px;min-width:0;min-height:0;background:var(--cream2);border-radius:22px;padding:8px}
@media (orientation:portrait){#play,#edit{flex-direction:column}.stage{flex:0 0 52%}.panel{flex:1 1 auto}#edit .stage{flex:0 0 48%}}
.hud{display:flex;align-items:center;gap:6px;flex:0 0 auto;min-height:48px}
.lv-name{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.lv-name b{font-size:20px}
.lv-name span{font-size:13px;color:var(--purple-d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal{margin-left:auto;display:flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:6px 12px;box-shadow:0 0 0 2px var(--purple-ll) inset;white-space:nowrap}
.goal .g-stars{display:flex;gap:2px}
.goal .g-stars i{width:17px;height:17px}
.goal .g-txt{font-size:15px}
.goal.over .g-txt{color:#B4483C}
.hud-r{display:flex;gap:6px}
.lv-name{text-align:left;white-space:nowrap;min-height:44px;justify-content:center}
.stage{container-type:inline-size}
@container (max-width:520px){
  .hud{gap:4px}.hud-r{gap:4px}
  .hud .icon-btn{width:41px;height:41px;flex-basis:41px;border-radius:12px}
  .hud .icon-btn svg{width:21px;height:21px}
  .lv-name span{display:none}.lv-name b{font-size:16px}
  #btnSay{display:none}
  .goal{padding:5px 9px;gap:4px}.goal .g-stars i{width:14px;height:14px}.goal .g-txt{font-size:13px}
}
.board-wrap{flex:1;display:grid;place-items:center;min-height:0;position:relative}
.board{display:grid;position:relative;border-radius:16px;overflow:hidden;box-shadow:0 0 0 4px var(--purple),0 9px 0 4px var(--purple-dd)}
.cell{width:var(--c);height:var(--c);background:var(--ta)}
.cell.b{background:var(--tb)}
.cell>svg,.cell>img{width:100%;height:100%}
.ents{position:absolute;inset:0;pointer-events:none}
.ent{position:absolute;left:0;top:0;width:var(--c);height:var(--c);transform:translate(calc(var(--c) * var(--x)),calc(var(--c) * var(--y)));transition:transform var(--spd) cubic-bezier(.45,.05,.35,1)}
.ent svg,.ent img{width:100%;height:100%}
.ent.star>*{width:74%;height:74%;margin:13%}
.ent.q>*{width:80%;height:80%;margin:10%}
.ent.cat{z-index:2}
.ent.hero{z-index:3}
.hb,.hf{width:100%;height:100%}
.hero.left .hf{transform:scaleX(-1)}
.hero.hop .hb{animation:hop var(--spd) ease-in-out}
.hero.cheer .hb{animation:cheer .6s ease-in-out 2}
.ent.star.gone>*{animation:gone .45s forwards}
.ent.star.pop>*{animation:starin .45s}
.ent.dot>i{position:absolute;left:50%;top:50%;width:22%;height:22%;margin:-11% 0 0 -11%;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px #fff8;animation:breathe 1.2s ease-in-out infinite}
.ent.puff{z-index:6}
.ent.puff span{position:absolute;left:50%;top:0;transform:translate(-50%,0);font-size:calc(var(--c) * .5);font-weight:700;color:var(--purple-dd);animation:floatup 1s forwards}
img.px{image-rendering:pixelated;image-rendering:crisp-edges}
/* แถบคำพูดพ่อมด: มีที่ของตัวเองใต้กระดาน ไม่บังตัวละคร */
.say{flex:0 0 auto;display:flex;align-items:center;gap:8px;min-height:48px;margin-top:8px;background:#fff;border:2px solid var(--purple-ll);border-radius:18px;padding:4px 12px 4px 4px;text-align:left}
.say.hot{border:3px solid var(--purple-l);padding:3px 11px 3px 3px;animation:popin .25s}
.say-face{width:40px;height:40px;flex:0 0 40px;border-radius:50%;background:var(--purple-ll);overflow:hidden}
.say-text{font-size:15px;line-height:1.3;color:var(--purple-d);flex:1;min-width:0;text-wrap:balance}
.say-ic{width:30px;height:30px;flex:0 0 30px;border-radius:50%;display:grid;place-items:center;background:var(--purple-ll);color:var(--purple-dd)}
.say-ic svg{width:18px;height:18px}
.say.hot .say-text{color:var(--ink);font-size:16px}

/* แผงการ์ด */
.prog{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:2px}
.strip{background:var(--cream);border-radius:16px;padding:6px 8px 8px;border:2px solid transparent}
.strip.cur{border-color:var(--purple-l)}
.strip.s-fn{background:#F4F0FC}
.strip.s-fn.active{border-color:var(--gold)}
.strip-label{font-size:13px;color:var(--purple-d);margin:0 0 5px 2px;display:flex;align-items:center;gap:4px}
.strip-label svg{width:15px;height:15px}
.strip-cards{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.card{width:var(--cs);height:var(--cs);border-radius:12px;display:grid;place-items:center;background:var(--purple);color:#fff;box-shadow:0 4px 0 var(--purple-dd);flex:0 0 auto;position:relative;transition:transform .1s}
.card svg{width:66%;height:66%}
.card.k-P{background:#A08FD6;box-shadow:0 4px 0 #7E6BC2}
.card.k-I{background:var(--purple-dd);box-shadow:0 4px 0 #44367A}
.card.k-loop,.card.k-F{background:var(--purple-d);box-shadow:0 4px 0 #4C3D8C}
.card.sel{outline:3px solid var(--gold);outline-offset:2px;transform:translateY(-2px)}
.card.run{background:var(--gold)!important;color:var(--ink);box-shadow:0 4px 0 var(--gold-d)!important;transform:translateY(-2px)}
.card.err{background:var(--peach)!important;box-shadow:0 4px 0 #D9614F!important;animation:shake .45s}
.card.new{animation:popin .2s}
.slot{width:var(--cs);height:var(--cs);border-radius:12px;border:3px dashed var(--purple-l);color:var(--purple-l);font-size:26px;line-height:1;display:grid;place-items:center;flex:0 0 auto}
.slot.on{border-color:var(--gold);color:var(--gold-d);background:#FFF3D6;animation:breathe 1.6s ease-in-out infinite}
.loop{display:inline-flex;align-items:center;gap:5px;background:var(--purple-ll);border:3px solid var(--purple-d);border-radius:15px;padding:3px 6px 3px 3px;flex:0 1 auto;max-width:100%}
.loop.tgt{border-color:var(--gold)}
.loop.sel{outline:3px solid var(--gold);outline-offset:2px}
.loop.looping{background:#FFF3D6}
.loop-head{width:40px;align-self:stretch;min-height:44px;border-radius:10px;background:var(--purple-d);color:#fff;display:grid;place-items:center}
.loop-head svg{width:24px;height:24px}
.loop-n{min-width:50px;height:44px;border-radius:999px;background:#fff;color:var(--purple-dd);font-size:17px;font-weight:700;padding:0 8px;box-shadow:0 0 0 2px var(--purple-l) inset}
.loop-body{display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-width:0}
.loop-body .card,.loop-body .slot{width:42px;height:42px}
.palette{display:grid;gap:6px;flex:0 0 auto}
.pal{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.pal .card{width:100%;max-width:var(--cp);height:var(--cp)}
.pal .card:active{transform:translateY(3px);box-shadow:0 1px 0 var(--purple-dd)}
.pal-cap{font-size:12px;color:var(--purple-d);line-height:1;white-space:nowrap}
.panel.tight .pal-cap{display:none}
.panel.tight .strip{display:flex;align-items:center;gap:6px;padding:3px 6px}
.panel.tight .strip-label{margin:0;flex:0 0 auto}
.panel.tight .strip-label span{display:none}
.panel.tight .s-main .strip-label{display:none}
.panel.tight .strip-cards .card,.panel.tight .strip-cards>.slot{width:40px;height:40px}
.panel.tight .loop-body .card,.panel.tight .loop-body .slot{width:40px;height:40px}
.panel.tight .ctl{height:48px;min-width:50px}
.panel.tight .runbtn{height:48px;font-size:16px;padding:0 8px;white-space:nowrap}
.panel.tight .runbtn svg{width:18px;height:18px}
.panel.tight .loop-n{height:40px;min-width:46px;font-size:15px}
/* จอเตี้ยมาก (พื้นที่คาถาต่ำกว่า 135px): แถวคาถาเป็นแถวเดียวเลื่อนซ้ายขวา มีขอบจางบอกว่ายังมีการ์ดต่อ */
.panel.tight .strip-cards{flex:1;min-width:0}
.panel.onerow .strip-cards{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;padding:2px 2px 5px;scrollbar-width:none}
.panel.onerow .strip-cards::-webkit-scrollbar{display:none}
.panel.onerow .strip-cards.ovf{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 26px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 26px),transparent)}
.panel.onerow .loop-body{flex-wrap:nowrap}
.strip{position:relative}
.sarrow{display:none;position:absolute;top:50%;width:40px;height:40px;margin-top:-20px;border-radius:50%;background:var(--gold);color:var(--ink);box-shadow:0 3px 0 var(--gold-d);z-index:3;place-items:center}
.sarrow svg{width:22px;height:22px}
.sarrow.l{left:-4px}.sarrow.r{right:-4px}
.strip.can-l .sarrow.l,.strip.can-r .sarrow.r{display:grid}
.panel.onerow .loop{flex:0 0 auto;max-width:none}
.palette.replacing .pal .card{outline:2px dashed var(--gold);outline-offset:2px}
.ctrls{display:flex;gap:6px;flex:0 0 auto}
.ctl{flex:0 0 auto;height:54px;min-width:58px;border-radius:16px;background:var(--purple-ll);color:var(--purple-dd);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0 8px;font-size:12px;box-shadow:0 4px 0 var(--purple-l)}
.ctl:active{transform:translateY(3px);box-shadow:0 1px 0 var(--purple-l)}
.ctl svg{width:22px;height:22px}
.ctl.confirm{background:var(--peach);color:#fff;box-shadow:0 4px 0 #D9614F}
.ctl:disabled{opacity:.4}
.runbtn{flex:1;height:54px;font-size:19px;padding:0 10px}
.runbtn.stopping{background:var(--purple-l);box-shadow:0 5px 0 var(--purple);}
.step-note{flex:1;display:grid;place-items:center;font-size:15px;color:var(--purple-d);text-align:center;line-height:1.2}

/* ปุ่มเปลี่ยนภาษา */
.lang-sw{position:absolute;top:calc(8px + var(--st));left:calc(8px + var(--sl));display:flex;gap:2px;background:#fff;border-radius:999px;padding:3px;box-shadow:0 0 0 2px var(--purple-l) inset;z-index:5}
.lang-sw button{min-width:50px;min-height:40px;padding:0 12px;border-radius:999px;font-size:16px;color:var(--purple-dd)}
.lang-sw button.on{background:var(--purple);color:#fff}
@container (max-width:520px){.g-unit{display:none}html[lang=en] .lv-name b{font-size:15px}}
.world{container-type:inline-size}
@container (max-width:380px){html[lang=en] .w-demo{padding:4px;width:40px;justify-content:center}html[lang=en] .w-demo span{display:none}html[lang=en] .w-name{font-size:17px}}
.seg.lang button{min-width:72px}
/* หน้าต่างซ้อน */
.ov{position:fixed;inset:0;background:#3d2c5a73;display:grid;place-items:center;z-index:50;padding:calc(12px + var(--st)) 12px calc(12px + var(--sb))}
.sheet{background:var(--cream);border-radius:28px;padding:20px 22px;width:min(560px,100%);max-height:100%;overflow:auto;box-shadow:0 0 0 4px var(--purple),0 12px 0 4px var(--purple-dd);text-align:center;animation:popin .28s}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.sheet .row.end{position:sticky;bottom:-20px;background:var(--cream);padding:8px 0 16px;margin-bottom:-16px;z-index:2}
.win-title{font-size:30px;font-weight:700;color:var(--purple-dd);margin:2px 0 6px}
.win-title.small{font-size:24px}
.big-stars{display:flex;justify-content:center;gap:6px;margin:6px 0}
.bs{width:76px;height:76px;display:inline-block}
.bs:nth-child(2){transform:translateY(-12px)}
.bs.on{animation:bigstar .55s var(--d) both}
.bs:nth-child(2).on{animation-name:bigstar2}
.bs.off svg path:first-child{fill:var(--stone);stroke:#D8C6A8}
.bs.off svg path+path{display:none}
.win-msg{margin:6px 0 0;font-size:18px}
.win-tip{margin:6px auto 0;font-size:16px;color:var(--purple-d);max-width:380px}
.p{margin:8px 0;font-size:17px;line-height:1.45}
.small{font-size:15px;color:var(--purple-d)}
.tiny{font-size:12px;color:var(--purple-d);margin:12px 0 0}
.intro{display:flex;gap:14px;align-items:center;text-align:left}
.intro-face{width:110px;flex:0 0 110px;border-radius:50%;background:var(--purple-ll);overflow:hidden}
.intro-world{font-size:15px;color:var(--purple-d)}
.intro-idea{font-size:24px;font-weight:700;color:var(--purple-dd);margin:2px 0 4px}
.intro-cards{display:flex;gap:12px;margin:10px 0 4px;flex-wrap:wrap}
.ic{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--purple-d)}
.ic .card{--cs:52px}
.intro .row{justify-content:flex-start}
@media (max-width:460px){.intro{flex-direction:column;text-align:center}.intro .row,.intro-cards{justify-content:center}.intro-face{width:86px;flex-basis:86px}}
.hint .g-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin:8px 0}
.g-row .card{--cs:36px;box-shadow:0 3px 0 var(--purple-dd)}
.g-row b{font-size:15px;color:var(--purple-d)}
.g-loop{display:inline-flex;align-items:center;gap:4px;border:2px solid var(--purple-d);border-radius:12px;padding:2px 5px;background:var(--purple-ll)}
.g-n{font-size:14px;color:var(--purple-dd)}
.g-more{font-size:22px;color:var(--purple-d)}
.wd-art,.end-art{display:flex;justify-content:center;align-items:flex-end;gap:4%;margin:0 auto 6px;max-width:420px}
.wd-art>div,.end-art>div{width:30%}
.wd-art .wd-star{width:22%;animation:float 2.4s ease-in-out infinite}
.gate input{width:140px;height:56px;border-radius:16px;border:3px solid var(--purple-l);font:inherit;font-size:28px;text-align:center;background:#fff;color:var(--ink);-webkit-user-select:text;user-select:text}
.gate input.err{border-color:var(--peach);animation:shake .4s}
.parent{text-align:left}
.parent .win-title{text-align:center}
.stat-row{display:flex;gap:8px;margin:6px 0 10px}
.stat-row>div{flex:1;background:#fff;border-radius:16px;padding:8px;text-align:center;box-shadow:0 0 0 2px var(--purple-ll) inset}
.stat-row b{display:block;font-size:22px;color:var(--purple-dd)}
.stat-row span{font-size:13px;color:var(--purple-d)}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:2px dashed var(--purple-ll)}
.rep-w{margin:10px 0 4px;font-weight:700;color:var(--purple-dd)}
.rep{display:grid;grid-template-columns:auto auto 1fr auto auto auto;gap:3px 10px;font-size:13px;align-items:center;background:#fff;border-radius:14px;padding:8px 10px;box-shadow:0 0 0 2px var(--purple-ll) inset}
.rep b{font-size:11.5px;font-weight:600;color:var(--purple-d)}
.rep span{color:var(--ink);white-space:nowrap}
.rep span.tough{color:#fff;background:var(--peach);border-radius:8px;padding:0 6px;justify-self:start}
.asg{margin:8px 0;background:#fff;border-radius:14px;padding:8px 10px;box-shadow:0 0 0 2px var(--purple-ll) inset}
.asg-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.asg-h span{font-weight:700;color:var(--purple-d)}.asg-h span.full{color:#3f9a52}
.asg-l{display:flex;flex-wrap:wrap;gap:4px}
.asg-l code{font-size:11.5px;padding:2px 6px;border-radius:6px;background:var(--purple-ll);color:var(--purple-d);font-family:ui-monospace,Menlo,monospace}
.asg-l code.ok{background:#E3F3E6;color:#2f7a40}
.set.col{flex-direction:column;align-items:flex-start}
.set .row{margin-top:4px;justify-content:flex-start}
.seg{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.seg button{min-height:40px;padding:6px 10px;border-radius:999px;background:#fff;box-shadow:0 0 0 2px var(--purple-l) inset;font-size:14px;color:var(--purple-dd)}
.seg button.on{background:var(--purple);color:#fff;box-shadow:none}
.tog{width:58px;height:44px;position:relative;flex:0 0 58px;background:none}
.tog::before{content:'';position:absolute;left:2px;top:6px;width:54px;height:32px;border-radius:999px;background:var(--purple-l)}
.tog i{position:absolute;left:6px;top:10px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.tog.on::before{background:var(--purple)}
.tog.on i{left:28px}
.vid video{width:100%;border-radius:18px;background:#000;display:block}
.demo-layer{position:fixed;inset:0;z-index:45;background:transparent}
.demo-skip svg{width:22px;height:22px}
.demo-skip{position:absolute;left:10px;top:calc(8px + var(--st));display:flex;align-items:center;gap:4px;min-height:46px;padding:6px 16px 6px 8px;border-radius:999px;background:#fff;color:var(--purple-dd);font-size:15px;box-shadow:0 0 0 2px var(--purple-l) inset,0 3px 0 var(--purple-l)}
#finger{position:fixed;left:0;top:0;width:54px;height:54px;z-index:46;pointer-events:none;opacity:0;transition:transform .55s cubic-bezier(.3,.7,.3,1),opacity .25s;filter:drop-shadow(0 3px 4px #3d2c5a66)}
#finger svg{width:100%;height:100%;transition:transform .12s}
#finger.show{opacity:1}#finger.press svg{transform:scale(.84) translateY(3px)}
.tapring{position:fixed;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:4px solid var(--gold);z-index:46;pointer-events:none;animation:tapring .5s ease-out forwards}
@keyframes tapring{from{transform:scale(.3);opacity:1}to{transform:scale(1.4);opacity:0}}
.w-demo{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:4px 12px 4px 8px;border-radius:999px;background:#fff;color:var(--purple-dd);font-size:13.5px;box-shadow:0 0 0 2px var(--purple-l) inset;white-space:nowrap}
.w-demo svg{width:18px;height:18px}
@media (max-width:600px){.w-demo{padding:4px;width:40px;justify-content:center}.w-demo span{display:none}}
.toast{position:fixed;left:50%;top:calc(12px + var(--st));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:16px;z-index:60;max-width:90vw;text-align:center}
.toast.show{animation:popin .2s}

/* แผนที่: ปุ่มพิเศษ */
.specials{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.sp{display:flex;align-items:center;gap:12px;background:#fff;border-radius:22px;padding:10px 14px;box-shadow:inset 0 0 0 2px var(--purple-ll),0 4px 0 var(--purple-l);text-align:left;min-height:66px}
.sp:active{transform:translateY(3px);box-shadow:inset 0 0 0 2px var(--purple-ll),0 1px 0 var(--purple-l)}
.sp-ico{width:48px;height:48px;flex:0 0 48px;border-radius:14px;background:var(--purple-ll);padding:5px}
.sp b{display:block;font-size:17px}.sp small{font-size:13px;color:var(--purple-d)}
/* สติกเกอร์ */
.stk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:16px 8px;margin:12px 0 4px}
.stk{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;transform:rotate(var(--r,0deg))}
.stk-art{width:80px;height:80px;border-radius:50%;background:var(--bg);border:5px solid #fff;box-shadow:0 4px 10px #3d2c5a33;padding:9px;overflow:hidden}
.stk-art svg,.stk-art img{width:100%;height:100%}
.stk.gold .stk-art{border-color:var(--gold)}
.stk-badge{position:absolute;top:-6px;left:calc(50% + 22px);width:30px;height:30px}
.stk-name{font-size:13px;line-height:1.2;text-align:center;color:var(--ink)}
.stk-how{font-size:11.5px;color:var(--purple-d);text-align:center;line-height:1.25}
.stk.off .stk-art{filter:grayscale(1);opacity:.35}
.stk.off .stk-badge{display:none}
.stk-num{position:relative;width:100%;height:100%}.stk-num b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;color:var(--ink);padding-top:5px}
.newst{margin:10px auto 0;padding:8px 10px 10px;background:#fff;border-radius:18px;box-shadow:inset 0 0 0 3px var(--gold);max-width:380px}
.stk-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.newst .stk{animation:popin .45s}
/* สร้างด่าน */
#edit{gap:8px}
.ed-panel{gap:8px}
.ed-scroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:2px}
.ed-tools{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.tool{width:100%;max-width:58px;aspect-ratio:1;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 2px var(--purple-l);padding:5px;display:grid;place-items:center;color:var(--purple-dd);min-width:40px}
.tool svg,.tool img{width:100%;height:100%}
.tool.on{box-shadow:inset 0 0 0 3px var(--gold);background:#FFF3D6}
.ed-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:15px;color:var(--purple-d)}
.ed-row{column-gap:14px;row-gap:8px}
.ed-row>span:not(.grp),.grp>span{min-width:34px}
.grp{display:inline-flex;align-items:center;gap:6px}
.ed-row b{min-width:26px;text-align:center;color:var(--ink);font-size:18px}
.ed-row b.wide{min-width:96px}
.ctl.sm{height:44px;min-width:44px;font-size:22px;padding:0 6px;flex-direction:row}
.ctl.sm svg{width:20px;height:20px}
.ed-row.seg{justify-content:flex-start}
.ed-row.seg button{min-height:44px;min-width:44px;padding:6px 12px;font-size:15px}
.ed-panel.short .pal-cap,.ed-panel.short .ed-row>span:not(.grp){display:none}
.ed-panel.short .ed-scroll{gap:7px}
.ed-panel.short .tool{max-width:48px}
.ed-panel.short .ed-row.seg button{padding:6px 9px}
@media (orientation:landscape) and (max-height:380px){#edit .stage{flex-basis:55%}#edit .ed-panel{flex-basis:45%}#edSay .say-text{font-size:14px;line-height:1.3}.ed-panel.short .ed-tools{gap:4px}}
#edBoard .cell{display:block;cursor:pointer}
#edBoard .cell:active{filter:brightness(.94)}
.mine-row{display:flex;align-items:center;gap:6px;padding:8px 0;border-top:2px dashed var(--purple-ll);text-align:left}
.mine-mini{display:grid;gap:1px;width:58px;flex:0 0 58px}
.mine-mini i{display:block;aspect-ratio:1;border-radius:2px;background:var(--stone)}
.mine-mini i.w{background:var(--purple-d)}.mine-mini i.s{background:var(--gold)}.mine-mini i.q{background:var(--purple-l)}.mine-mini i.h{background:#8FCBEF}.mine-mini i.c{background:#F2A65A}
.mine-txt{flex:1;min-width:0;display:flex;flex-direction:column}.mine-txt b{font-size:15px}.mine-txt span{font-size:13px;color:var(--purple-d)}
.help-steps{text-align:left;margin:6px 0 0;padding-left:22px;font-size:16px;line-height:1.5}
.lv-name b{overflow:hidden;text-overflow:ellipsis;max-width:46vw}
@keyframes popin{from{transform:scale(.88);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-14%)}}
@keyframes cheer{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-24%) rotate(-7deg)}60%{transform:translateY(-8%) rotate(7deg)}}
@keyframes gone{to{transform:scale(1.7) rotate(30deg);opacity:0}}
@keyframes starin{from{transform:scale(0) rotate(-90deg)}to{transform:scale(1) rotate(0)}}
@keyframes floatup{from{transform:translate(-50%,10%);opacity:1}to{transform:translate(-50%,-110%);opacity:0}}
@keyframes bigstar{0%{transform:scale(0) rotate(-120deg)}70%{transform:scale(1.2) rotate(10deg)}100%{transform:scale(1) rotate(0)}}
@keyframes bigstar2{0%{transform:translateY(-12px) scale(0) rotate(-120deg)}70%{transform:translateY(-12px) scale(1.25) rotate(10deg)}100%{transform:translateY(-12px) scale(1.1) rotate(0)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 2px var(--gold) inset,0 0 0 0 #FFB62799}50%{box-shadow:0 0 0 2px var(--gold) inset,0 0 0 8px #FFB62700}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<noscript><p style="padding:20px">เกมนี้ต้องเปิด JavaScript · This game needs JavaScript</p></noscript>

<section id="home" class="screen">
  <div class="lang-sw" role="group" aria-label="ภาษา / Language"><button class="lang-opt" data-lang="th" lang="th">ไทย</button><button class="lang-opt" data-lang="en" lang="en">EN</button></div>
  <div class="home-wrap">
    <div class="home-art" id="homeArt"></div>
    <div class="home-side">
      <h1 class="title"><small data-t="h_small">เกมฝึกโค้ดดิ้ง</small><span data-t="title">ลีอากับการ์ดเวทมนตร์</span></h1>
      <p class="sub" data-t="h_sub">เรียงการ์ดคาถา พาไปหาน้องหมา สำหรับเด็ก 5–10 ขวบ</p>
      <div class="who">
        <button class="ava" data-ava="girl" data-ta="a_girl" aria-label="เลือกตัวละครเด็กผู้หญิง"></button>
        <button class="ava" data-ava="boy" data-ta="a_boy" aria-label="เลือกตัวละครเด็กผู้ชาย"></button>
        <input id="nameIn" maxlength="12" placeholder="ชื่อของหนู" data-tp="name_ph" aria-label="ชื่อผู้เล่น" data-ta="a_name" autocomplete="off">
      </div>
      <div class="pets"><span data-t="h_find">ไปหา</span><button class="pet" data-pet="kim" aria-label="ไปหาน้องคิม"></button><button class="pet" data-pet="dukdik" aria-label="ไปหาน้องดุ๊กดิ๊ก"></button></div>
      <button class="btn-gold" id="btnPlay">เล่นเลย</button>
      <div class="home-tools">
        <button class="chip" id="btnMap" data-t="c_map">แผนที่ด่าน</button>
        <button class="chip" id="btnInstall" hidden data-t="c_install">ติดตั้งเป็นแอป</button>
        <button class="chip" id="btnShare" data-t="c_share">แชร์ให้เพื่อน</button>
        <button class="chip" id="btnParent" data-t="c_parent">ผู้ปกครอง</button>
      </div>
    </div>
  </div>
</section>

<section id="map" class="screen">
  <div class="bar">
    <button class="icon-btn" id="mapHome" data-ta="a_home" aria-label="กลับหน้าแรก"></button>
    <div class="bar-title" data-t="map_title">แผนที่ผจญภัย</div>
    <div class="total" id="totalStars"></div>
  </div>
  <div class="worlds" id="worlds"></div>
</section>

<section id="play" class="screen">
  <div class="stage">
    <div class="hud">
      <button class="icon-btn" id="btnBack" data-ta="a_tomap" aria-label="กลับแผนที่"></button>
      <button class="lv-name" id="lvName" data-ta="a_hear_task" aria-label="ฟังโจทย์อีกครั้ง"></button>
      <div class="goal" id="goal" aria-live="polite"></div>
      <div class="hud-r">
        <button class="icon-btn hint" id="btnHint" data-ta="a_hint" aria-label="คำใบ้" hidden></button>
        <button class="icon-btn" id="btnSay" data-ta="a_hear_task" aria-label="ฟังโจทย์อีกครั้ง"></button>
        <button class="icon-btn" id="btnHelp" data-ta="a_howworld" aria-label="วิธีเล่นโลกนี้"></button>
        <button class="icon-btn" id="btnSpeed" data-ta="a_speed" aria-label="สลับความเร็ว"></button>
      </div>
    </div>
    <div class="board-wrap" id="boardWrap"><div class="board" id="board"></div></div>
    <button class="say" id="say" data-ta="a_hear" aria-label="ฟังอีกครั้ง"><span class="say-face" id="sayFace"></span><span class="say-text" id="sayText" aria-live="polite"></span><span class="say-ic" id="sayIc"></span></button>
  </div>
  <div class="panel" id="panel">
    <div class="prog" id="prog"></div>
    <div class="palette" id="palette"></div>
    <div class="ctrls">
      <button class="ctl" id="btnUndo"></button>
      <button class="ctl" id="btnClear"></button>
      <button class="btn-gold runbtn" id="btnRun"></button>
      <div class="step-note" id="stepNote" hidden data-t="step_note">แตะลูกศร<br>แล้วจะเดินทันที</div>
    </div>
  </div>
</section>

<section id="edit" class="screen">
  <div class="stage">
    <div class="hud">
      <button class="icon-btn" id="edBack" data-ta="a_tomap" aria-label="กลับแผนที่"></button>
      <div class="lv-name"><b data-t="ed_title">สร้างด่านเอง</b><span data-t="ed_sub">แล้วส่งให้เพื่อนเล่น</span></div>
      <div class="hud-r" style="margin-left:auto"><button class="icon-btn" id="edHelp" data-ta="a_edhelp" aria-label="วิธีสร้างด่าน"></button></div>
    </div>
    <div class="board-wrap" id="edWrap"><div class="board" id="edBoard"></div></div>
    <button class="say" id="edSay" data-ta="a_hear" aria-label="ฟังอีกครั้ง"><span class="say-face" id="edFace"></span><span class="say-text" id="edSayText"></span><span class="say-ic" id="edSayIc"></span></button>
  </div>
  <div class="panel ed-panel">
    <div class="ed-scroll">
      <div class="ed-tools" id="edTools"></div>
      <div class="ed-row seg" id="edSize"></div>
      <div class="ed-row" id="edTheme"></div>
      <div class="ed-row seg" id="edTier"></div>
    </div>
    <div class="ctrls"><button class="ctl" id="edClear"></button><button class="ctl" id="edMine"></button><button class="btn-gold runbtn" id="edTest"></button></div>
  </div>

/*ENGINE_START*/
const MOVES={U:[0,-1],D:[0,1],L:[-1,0],R:[1,0]};
function parseMap(rows){
  const m={w:rows[0].length,h:rows.length,walls:new Set(),stars:new Set(),rand:[],hero:null,cat:null};
  rows.forEach((row,y)=>{
    if(row.length!==m.w)throw new Error('แผนที่กว้างไม่เท่ากัน: '+rows.join('/'));
    for(let x=0;x<row.length;x++){const ch=row[x],k=x+','+y;
      if(ch==='#')m.walls.add(k);else if(ch==='*')m.stars.add(k);else if(ch==='?')m.rand.push(k);
      else if(ch==='H')m.hero={x,y};else if(ch==='C')m.cat={x,y};}
  });
  return m;
}
function parseSol(str){
  let uid=0;
  const seq=s=>{let i=0;const p=()=>{const out=[];
    while(i<s.length){const c=s[i];
      if(c===' '){i++;continue}
      if(c===')')return out;
      if(c>='0'&&c<='9'){let n='';while(s[i]>='0'&&s[i]<='9')n+=s[i++];i++;const body=p();i++;out.push({id:'h'+(uid++),t:'loop',n:+n,body});}
      else{out.push({id:'h'+(uid++),t:c});i++;}
    }return out};return p()};
  const parts=str.split('|');return {main:seq(parts[0]),fn:seq(parts[1]||'')};
}
function countList(list){let n=0;for(const x of list){n++;if(x.t==='loop')n+=countList(x.body)}return n}
function countProg(p){return countList(p.main)+countList(p.fn)}
function starsFor(n,par){return n<=par?3:n<=par+2?2:1}
function hasType(list,t){return list.some(n=>n.t===t||(n.t==='loop'&&hasType(n.body,t)))}
function trace(m,prog,starList){
  const st={x:m.hero.x,y:m.hero.y,stars:new Set(starList),steps:0};const ev=[];let res=null;
  const run=(list,depth)=>{for(const nd of list){if(res)return;
    if(++st.steps>600){res={r:'limit'};return}
    if(nd.t==='loop'){for(let i=1;i<=nd.n;i++){ev.push({k:'loop',id:nd.id,i,n:nd.n});run(nd.body,depth);if(res)return}ev.push({k:'endloop',id:nd.id})}
    else if(nd.t==='F'){if(depth>0){res={r:'recur',id:nd.id};return}ev.push({k:'call',id:nd.id});run(prog.fn,depth+1);if(res)return;ev.push({k:'ret',id:nd.id})}
    else if(MOVES[nd.t]){const dx=MOVES[nd.t][0],dy=MOVES[nd.t][1],nx=st.x+dx,ny=st.y+dy;
      const out=nx<0||ny<0||nx>=m.w||ny>=m.h;
      if(out||m.walls.has(nx+','+ny)){ev.push({k:'bump',id:nd.id,x:st.x,y:st.y,dx,dy,out});res={r:'bump',id:nd.id,out};return}
      ev.push({k:'move',id:nd.id,x:nx,y:ny});st.x=nx;st.y=ny;
      if(nx===m.cat.x&&ny===m.cat.y&&st.stars.size===0){ev.push({k:'win'});res={r:'win'};return}}
    else if(nd.t==='P'||nd.t==='I'){const k=st.x+','+st.y;
      if(st.stars.has(k)){st.stars.delete(k);ev.push({k:'pick',id:nd.id,x:st.x,y:st.y})}
      else if(nd.t==='P'){ev.push({k:'nostar',id:nd.id,x:st.x,y:st.y});res={r:'nostar',id:nd.id};return}
      else ev.push({k:'skip',id:nd.id,x:st.x,y:st.y})}
  }};
  run(prog.main,0);
  if(!res)res=st.stars.size?{r:'stars_left'}:{r:'not_reached'};
  return {ev,res,end:{x:st.x,y:st.y},left:[...st.stars]};
}
/* ทุกแบบที่ดาวสุ่มอาจโผล่ (ถ้ามากเกินไปใช้สุ่มตัวอย่าง) */
function configs(m){
  const k=m.rand.length,fixed=[...m.stars];
  if(!k)return [fixed];
  const out=[],all=2**k;
  if(all<=4096){for(let mask=0;mask<all;mask++){const c=fixed.slice();for(let i=0;i<k;i++)if(mask>>i&1)c.push(m.rand[i]);out.push(c)}}
  else{out.push(fixed.concat(m.rand),fixed.slice());for(let j=0;j<1500;j++){const c=fixed.slice();for(const r of m.rand)if(Math.random()<.5)c.push(r);out.push(c)}}
  return out;
}
/* ผ่านเมื่อคาถาใช้ได้กับทุกแบบที่ดาวโผล่ ถ้าไม่ผ่านจะเลือกแบบที่พังมาแสดง */
function evaluate(m,prog){
  const cs=configs(m);let fail=null,failN=0;
  for(const c of cs){const t=trace(m,prog,c);if(t.res.r!=='win'){failN++;if(!fail||Math.random()<1/failN)fail={cfg:c,t}}}
  if(fail)return {ok:false,cfg:fail.cfg,t:fail.t,n:cs.length};
  let cfg=cs[Math.floor(Math.random()*cs.length)];
  if(m.rand.length){const rich=cs.filter(c=>c.length>m.stars.size+1);if(rich.length)cfg=rich[Math.floor(Math.random()*rich.length)]}
  return {ok:true,cfg,t:trace(m,prog,cfg),n:cs.length};
}

function pickVoice(){try{const vs=speechSynthesis.getVoices();thVoice=vs.find(v=>/^th(-|_|$)/i.test(v.lang))||null;enVoice=vs.find(v=>/^en(-|_)US/i.test(v.lang))||vs.find(v=>/^en(-|_|$)/i.test(v.lang))||null}catch(e){}}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
/* ใช้เสียงไทยของเครื่อง ถ้าเครื่องยังไม่บอกรายชื่อเสียง ลองพูดภาษาไทยไปเลย ถ้ามีรายชื่อแต่ไม่มีเสียงไทย จะไม่พูด (กันอ่านเพี้ยน) */
function tts(text){if(!('speechSynthesis' in window))return;let vs=[];try{vs=speechSynthesis.getVoices()}catch(e){}
  if(isEN()){if(!enVoice&&vs.length)pickVoice();try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';if(enVoice)u.voice=enVoice;u.rate=.95;u.pitch=1.1;speechSynthesis.speak(u)}catch(e){}return}
  if(!thVoice&&vs.length)pickVoice();if(!thVoice&&vs.length)return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='th-TH';if(thVoice)u.voice=thVoice;u.rate=.92;u.pitch=1.1;speechSynthesis.speak(u)}catch(e){}}
function stopVoice(){try{curAudio&&curAudio.pause()}catch(e){}curAudio=null;try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}}
function speak(id){
  if(!S.voice)return;stopVoice();const text=VOICE[id];if(!text)return;const f=voiceDir(S.lang)+voiceFile(id)+'.mp3';
  if(vok[f]===false||location.protocol==='file:')return tts(text);
  const a=new Audio(f);curAudio=a;let settled=false;
  a.oncanplaythrough=()=>{if(settled)return;settled=true;vok[f]=true;if(curAudio===a)a.play().catch(()=>tts(text))};
  a.onerror=()=>{if(settled)return;settled=true;vok[f]=false;if(curAudio===a)tts(text)};
  a.load();
}

/* ---------- หน้าเล่น ---------- */
let P=null;
function cloneList(list){return list.map(n=>n.t==='loop'?{id:'n'+(++P.uid),t:'loop',n:n.n,body:cloneList(n.body)}:{id:'n'+(++P.uid),t:n.t})}
/* แปลงคาถาเป็นข้อความสั้น ๆ (แบบเดียวกับ sol) ใช้เก็บประวัติย้อนกลับและจำคาถาที่วางค้างไว้ */
function toSol(list){return list.map(n=>n.t==='loop'?n.n+'('+toSol(n.body)+')':n.t).join('')}
function progStr(p){return toSol(p.main)+(p.fn.length?'|'+toSol(p.fn):'')}
function loadProg(str){const q=parseSol(str);return {main:cloneList(q.main),fn:cloneList(q.fn)}}
function snap(){const tg=P.target,li=tg.loop?P.prog[tg.s].findIndex(n=>n.id===tg.loop):-1;P.hist.push({p:progStr(P.prog),s:tg.s,li});if(P.hist.length>40)P.hist.shift()}
function restore(h){P.prog=loadProg(h.p);const nd=h.li>=0?P.prog[h.s][h.li]:null;P.target={s:h.s,loop:nd&&nd.t==='loop'?nd.id:null};P.sel=null}
function selIsCard(){const L=P.sel&&locate(P.sel);return !!(L&&L.nd.t!=='loop')}
function startLevel(idx){const lv=ALL[idx];if(lv)playLevel(lv)}
function playLevel(lv){
  if(P)P.abort=true;closeSheet();stopVoice();
  P={lv,m:lv.m,prog:{main:[],fn:[]},target:{s:'main',loop:null},sel:null,running:false,abort:false,ran:false,fails:0,uid:0,
     hero:{x:lv.m.hero.x,y:lv.m.hero.y},stars:new Set(lv.m.stars),runCfg:false,dots:null,hintSaid:false,won:false,hist:[],runStart:0,queue:[]};
  if(lv.kind!=='step'&&!lv.custom){const d=S.drafts[lv.id];if(d)P.prog=loadProg(d);else if(lv.start)P.prog=loadProg(lv.start)}
  show('play');calm();
  requestAnimationFrame(()=>{renderBoard();renderPalette();renderProg();renderCtrls();renderHud();layout()});
  if(S.play.breakUntil>Date.now())return openBreak();
  if(lv.custom==='demo')return;
  if(!lv.custom&&lv.li===0&&!S.seen['w'+lv.w.n])setTimeout(()=>openIntro(lv.w),250);
  else if(!lv.custom&&lv.demo&&!S.seen[lv.demo])setTimeout(()=>{if(P&&P.lv===lv)openNewThing(lv)},250);
  else setTimeout(()=>{if(P&&P.lv===lv&&!P.running)speak(say.cur)},450);
}
/* โจทย์ของด่านแสดงค้างไว้เสมอ ข้อความใหม่ (เช่น ชนแล้ว) เด่นขึ้นจนกว่าจะแก้การ์ดหรือร่ายใหม่ */
function calm(){if(!P||(P.demo&&!P.demoStop))return;const k=KIND_SAY[P.lv.kind],el=$('#say');el.classList.remove('hot');$('#sayText').textContent=VOICE[k];say.cur=k;$('#sayFace').innerHTML=art('wizard',A.wizard)}
function levelSay(){calm();speak(say.cur)}
function say(text,voiceId){
  const el=$('#say');$('#sayText').textContent=text;$('#sayFace').innerHTML=art('wizard',A.wizard);
  el.classList.remove('hot');void el.offsetWidth;el.classList.add('hot');say.cur=voiceId;if(voiceId)speak(voiceId);
}
function layout(){
  if(!P)return;const m=P.m,stage=$('#play .stage');
  /* แนวตั้ง: ให้กระดานสูงเท่าที่ต้องใช้ ที่เหลือยกให้แผงการ์ด (ไม่เกิน 55% ของจอ) */
  if(innerHeight>innerWidth){
    const W=stage.clientWidth||innerWidth-16,cell=Math.min(84,Math.floor((W-16)/m.w));
    const need=$('#play .hud').offsetHeight+$('#say').offsetHeight+cell*m.h+36;
    stage.style.flexBasis=Math.min(need,Math.round(innerHeight*.55))+'px';
  }else stage.style.flexBasis='';
  const r=$('#boardWrap').getBoundingClientRect();
  const c=Math.max(30,Math.min(104,Math.floor(Math.min((r.width-16)/m.w,(r.height-20)/m.h))));
  document.documentElement.style.setProperty('--c',c+'px');
  const panel=$('#panel'),pal=$('#palette'),n=P.lv.cards.length,cols=n<=5?n:4;
  pal.style.gridTemplateColumns=`repeat(${cols},minmax(0,1fr))`;
  const pr=panel.getBoundingClientRect(),rows=Math.ceil(n/cols);
  panel.classList.toggle('tight',pr.height<(rows>1?420:330));
  const w=pal.clientWidth||pr.width-16;
  const port=innerHeight>innerWidth,cap=rows>1?((port&&pr.height<400)||pr.height<330?46:pr.height<460?52:64):64;
  const cp=Math.max(40,Math.min(cap,Math.floor((w-(cols-1)*6)/cols)));
  pal.style.setProperty('--cp',cp+'px');
  panel.classList.toggle('onerow',panel.classList.contains('tight')&&$('#prog').clientHeight<135);
  fitStrips();
}
/* แถวเดียว: เลื่อนให้เห็นช่อง + ที่กำลังจะวาง และใส่ขอบจางถ้ามีการ์ดล้น */
function fitStrips(){
  if(!P)return;const one=$('#panel').classList.contains('onerow');
  const on=$('#prog .slot.on');if(on&&!P.running)on.scrollIntoView({block:'nearest',inline:'nearest'});
  $$('#prog .strip-cards').forEach(e=>{e.classList.toggle('ovf',one&&e.scrollWidth>e.clientWidth+2);arrows(e);if(!e.dataset.w){e.dataset.w=1;e.addEventListener('scroll',()=>arrows(e),{passive:true})}});
}
/* ลูกศร ‹ › โผล่เมื่อยังมีการ์ดซ่อนอยู่ด้านนั้น แตะเพื่อเลื่อน */
function arrows(e){const st=e.closest('.strip'),one=$('#panel').classList.contains('onerow');if(!st)return;
  st.classList.toggle('can-l',one&&e.scrollLeft>4);st.classList.toggle('can-r',one&&e.scrollLeft+e.clientWidth<e.scrollWidth-4)}
function renderBoard(){

  b.style.gridTemplateColumns=`repeat(${m.w},var(--c))`;b.style.setProperty('--ta',t[0]);b.style.setProperty('--tb',t[1]);
  let h='';
  for(let y=0;y<m.h;y++)for(let x=0;x<m.w;x++){const k=x+','+y,wall=m.walls.has(k),tile=IMG['tile'+w];
    h+=`<div class="cell ${(x+y)%2?'b':''}"${tile?` style="background:url(${tile.src}) center/cover"`:''}>${wall?art('wall'+w,()=>A.wall(w)):''}</div>`}
  b.innerHTML=h+'<div class="ents" id="ents"></div>';renderEnts();
}

  (P.dots||[]).forEach(k=>{const[x,y]=k.split(',');h+=`<div class="ent dot" style="--x:${x};--y:${y}"><i></i></div>`});
  h+=`<div class="ent hero" id="hero" style="--x:${P.hero.x};--y:${P.hero.y}"><div class="hb"><div class="hf">${heroArt()}</div></div></div>`;

function updateGoal(){

  if(par==null){$('#goal').innerHTML=`<span class="g-txt">${tx(`ใช้การ์ด ${n} ใบ`,`${n} cards`)}</span>`;$('#goal').classList.remove('over');$('#goal').setAttribute('aria-label',tx(`ใช้การ์ด ${n} ใบ`,`Using ${n} cards`));return}

}
function renderSpeed(){$('#btnSpeed').innerHTML=S.fast?ICON.fast:ICON.slow;$('#btnSpeed').classList.toggle('on',S.fast);document.documentElement.style.setProperty('--spd',S.fast?'280ms':'600ms')}
function renderPalette(){
  const cards=PAL_ORDER.filter(t=>P.lv.cards.includes(t));
  $('#palette').innerHTML=cards.map(t=>`<div class="pal"><button class="card k-${t}" data-add="${t}" aria-label="${tx('การ์ด'+CARDS[t].name,CARDS[t].name+' card')}">${CARDS[t].icon}</button><span class="pal-cap">${CARDS[t].name}</span></div>`).join('');
  $('#palette').classList.toggle('replacing',selIsCard());
}
function cardHTML(nd){
  if(nd.t==='loop')return loopHTML(nd);
  return `<button class="card k-${nd.t} ${P.sel===nd.id?'sel':''}" data-id="${nd.id}" aria-label="${tx('การ์ด'+CARDS[nd.t].name,CARDS[nd.t].name+' card')}">${CARDS[nd.t].icon}</button>`;
}
function loopHTML(nd){
  const tgt=P.target.loop===nd.id;
  return `<div class="loop ${tgt?'tgt':''} ${P.sel===nd.id?'sel':''}" data-loop="${nd.id}"><button class="loop-head" data-lhead="${nd.id}" aria-label="${tx('วงทำซ้ำ แตะเพื่อเลือก','Repeat loop, tap to select')}">${CARDS.loop.icon}</button><button class="loop-n" data-lcount="${nd.id}" aria-label="${tx(`จำนวนรอบ ${nd.n} แตะเพื่อเปลี่ยน`,`${nd.n} times, tap to change`)}">×${nd.n}</button><div class="loop-body">${nd.body.map(cardHTML).join('')}<button class="slot ${tgt?'on':''}" data-slot="loop:${nd.id}" aria-label="${tx('วางการ์ดในวง','Add a card to the loop')}">+</button></div></div>`;

function stripHTML(s,label){
  const on=P.target.s===s&&!P.target.loop,step=P.lv.kind==='step';
  return `<div class="strip s-${s} ${P.target.s===s&&P.lv.cards.includes('F')?'cur':''}" data-strip="${s}"><div class="strip-label">${label}</div><div class="strip-cards">${P.prog[s].map(cardHTML).join('')}${step?'':`<button class="slot ${on?'on':''}" data-slot="${s}" aria-label="${tx('วางการ์ดต่อท้าย','Add a card at the end')}">+</button>`}</div><button class="sarrow l" data-scroll="-1" aria-label="${tx('เลื่อนดูการ์ดทางซ้าย','Scroll left')}">${ICON.back}</button><button class="sarrow r" data-scroll="1" aria-label="${tx('เลื่อนดูการ์ดทางขวา','Scroll right')}">${ICON.next}</button></div>`;

function renderProg(){

  h+=stripHTML('main',`<span>${P.lv.cards.includes('F')?tx('คาถาหลัก','Main spell'):tx('คาถา','Spell')}</span>`);

function renderCtrls(){
  const step=P.lv.kind==='step',run=P.running;
  $('#btnUndo').innerHTML=P.sel?ICON.trash+`<span>${tx('ลบใบนี้','Delete')}</span>`:ICON.undo+`<span>${tx('ย้อน','Undo')}</span>`;
  const cl=$('#btnClear');cl.classList.remove('confirm');cl.innerHTML=ICON.restart+(P.lv.kind==='debug'?`<span>${tx('ของเดิม','Reset')}</span>`:step?`<span>${tx('เริ่มใหม่','Restart')}</span>`:`<span>${tx('ล้าง','Clear')}</span>`);
  const rb=$('#btnRun');rb.hidden=step;$('#stepNote').hidden=!step;
  rb.innerHTML=run?ICON.stop+`<span>${tx('หยุด','Stop')}</span>`:ICON.play+`<span>${tx('ร่ายคาถา!','Cast Spell!')}</span>`;rb.classList.toggle('stopping',run);
  $('#btnUndo').disabled=run;cl.disabled=run;

function locate(id){
  const walk=(list,parent)=>{for(let i=0;i<list.length;i++){const n=list[i];if(n.id===id)return {nd:n,list,i,parent};if(n.t==='loop'){const r=walk(n.body,n);if(r)return r}}return null};
  for(const s of ['main','fn']){const r=walk(P.prog[s],null);if(r)return Object.assign(r,{s})}return null;
}
function targetList(){
  const tg=P.target;if(tg.loop){const L=locate(tg.loop);if(L)return L.nd.body;P.target={s:tg.s,loop:null}}
  return P.prog[P.target.s];
}
/* หลังร่ายคาถา คืนตัวละครและดาวกลับที่เดิม (จุดคำใบ้ยังอยู่จนกว่าจะผ่านด่าน) */
function resetRunView(){
  if(!P.ran)return;P.ran=false;P.hero={x:P.m.hero.x,y:P.m.hero.y};P.stars=new Set(P.m.stars);P.runCfg=false;renderEnts();
}
function afterEdit(newId){
  resetRunView();if($('#say').classList.contains('hot'))calm();renderProg();renderCtrls();
  if(P.lv.kind!=='step'&&!P.lv.custom){const s=progStr(P.prog);if(s)S.drafts[P.lv.id]=s;else delete S.drafts[P.lv.id];save()}
  if(newId){const el=$(`#prog [data-id="${newId}"]`)||$(`#prog [data-loop="${newId}"]`);if(el){el.classList.add('new');el.scrollIntoView({block:'nearest',inline:'nearest'})}}
}

function addCard(t){
  if(!P||P.won)return;ac();
  if(P.lv.kind==='step'){if(P.running){if(P.queue.length<3)P.queue.push(t);return}return stepAdd(t)}
  if(P.running)return;
  if(P.sel){const L=locate(P.sel);P.sel=null;
    if(L&&L.nd.t!=='loop'&&t!=='loop'){if(t==='F'&&L.s==='fn'){renderProg();return warn(tx('ในคาถาของฉันใช้การ์ดประกายไม่ได้นะ','The sparkle card can’t go inside your own spell.'))}
      snap();L.nd.t=t;SFX.tap();afterEdit(L.nd.id);return}}
  const tg=P.target;
  if(t==='loop'&&tg.loop){renderProg();return warn(tx('วางวงซ้อนในวงไม่ได้นะ','You can’t put a loop inside a loop.'))}
  if(t==='F'&&tg.s==='fn'){renderProg();return warn(tx('ในคาถาของฉันใช้การ์ดประกายไม่ได้นะ','The sparkle card can’t go inside your own spell.'))}
  if(countProg(P.prog)>=40){renderProg();return warn(P.lv.cards.includes('loop')?tx('การ์ดเยอะเกินไปแล้ว ลองใช้ทำซ้ำดูนะ','Too many cards! Try the repeat card.'):tx('การ์ดเยอะเกินไปแล้ว ลองเริ่มใหม่นะ','Too many cards! Try starting again.'))}
  snap();
  const nd={id:'n'+(++P.uid),t};if(t==='loop'){nd.n=2;nd.body=[]}
  targetList().push(nd);if(t==='loop')P.target={s:tg.s,loop:nd.id};
  SFX.tap();afterEdit(nd.id);
}
/* ย้อน = ถอยการแก้ครั้งล่าสุดจริง ๆ ถ้าเลือกการ์ดไว้ ปุ่มนี้กลายเป็น "ลบใบนี้" */
function undo(){
  if(!P||P.running||P.won)return;
  if(P.lv.kind==='step'){if(!P.prog.main.length)return;P.prog.main.pop();const tr=trace(P.m,P.prog,[...P.m.stars]);moveHeroTo(tr.end);renderProg();return}
  if(P.sel){const L=locate(P.sel);if(L){snap();L.list.splice(L.i,1);if(P.target.loop===L.nd.id)P.target={s:L.s,loop:null}}P.sel=null;SFX.tap();afterEdit();return}
  if(!P.hist.length){toast(tx('ย้อนต่อไม่ได้แล้ว','Nothing more to undo'));return}
  restore(P.hist.pop());SFX.tap();afterEdit();
}
function clearAll(){
  if(!P||P.running||P.won)return;const b=$('#btnClear');
  if(P.lv.kind==='step'){P.prog.main=[];moveHeroTo(P.m.hero);renderProg();return}

  snap();P.prog=P.lv.start?loadProg(P.lv.start):{main:[],fn:[]};P.target={s:'main',loop:null};P.sel=null;afterEdit();

function moveHeroTo(p){P.hero={x:p.x,y:p.y};const h=$('#hero');if(h){h.style.setProperty('--x',p.x);h.style.setProperty('--y',p.y)}}

/* โลก 1: แตะแล้วเดินทันที */
async function stepAdd(t){
  const me=P,nd={id:'n'+(++me.uid),t};me.prog.main.push(nd);renderProg();
  const tr=trace(me.m,me.prog,[...me.m.stars]);me.running=true;
  markRun(nd.id);
  if(tr.res.r==='bump'){
    await animBump(tr.ev[tr.ev.length-1]);if(P!==me)return;markErr(nd.id);await sleep(250);if(P!==me)return;
    me.prog.main.pop();me.queue=[];me.fails++;S.tries[me.lv.id]=(S.tries[me.lv.id]||0)+1;statRun(me.lv,false);save();renderProg();say(VOICE.bump_step,'bump_step');
    if(me.fails>=3)showHintBtn();
  }else{
    const mv=tr.ev.filter(e=>e.k==='move').pop();if(mv)await animMove(mv,isFast()?280:450);if(P!==me)return;
    if(tr.res.r==='win'){me.running=false;me.queue=[];return finishWin()}
  }
  me.running=false;clearRun();
  if(me.queue.length&&P===me&&!me.won)stepAdd(me.queue.shift());
}

/* ร่ายคาถา */
async function runProgram(){
  if(!P||P.won)return;
  if(P.running){if(Date.now()-P.runStart>800)P.abort=true;return}   /* กันแตะเบิ้ลแล้วหยุดเอง */
  ac();P.sel=null;
  if(!P.prog.main.length){renderProg();return say(VOICE.empty,'empty')}
  const emptyLoop=findEmptyLoop();if(emptyLoop){P.target={s:emptyLoop.s,loop:emptyLoop.nd.id};renderProg();return say(VOICE.empty_loop,'empty_loop')}
  if(hasType(P.prog.main,'F')&&!P.prog.fn.length){P.target={s:'fn',loop:null};renderProg();return say(VOICE.empty_fn,'empty_fn')}
  resetRunView();renderProg();calm();
  const me=P;let ev=evaluate(me.m,me.prog);if(me.nextCfg&&ev.ok){ev={ok:true,cfg:me.nextCfg,t:trace(me.m,me.prog,me.nextCfg),n:ev.n}}me.nextCfg=null;me.running=true;me.abort=false;me.ran=true;me.runStart=Date.now();renderCtrls();
  if(me.m.rand.length){me.runCfg=true;me.stars=new Set(ev.cfg);renderEnts();$$('.ent.star').forEach(s=>s.classList.add('pop'));SFX.pick();await sleep(650)}
  await playEvents(ev.t.ev,me);
  if(P!==me)return;
  if(me.abort){me.running=false;me.abort=false;clearRun();renderCtrls();resetRunView();return}
  if(ev.ok){me.running=false;return finishWin()}
  await sleep(200);if(P!==me)return;me.running=false;renderCtrls();onFail(ev.t.res);
}
function findEmptyLoop(){
  for(const s of ['main','fn']){const f=l=>{for(const n of l)if(n.t==='loop'&&!n.body.length)return n;return null};const n=f(P.prog[s]);if(n)return {s,nd:n}}return null;
}
const isFast=()=>S.fast&&!(P&&P.lv.custom==='demo');
async function playEvents(evs,me){
  const spd=isFast()?280:600;
  for(const e of evs){if(P!==me||me.abort)return;
    switch(e.k){
      case 'loop':setLoopBadge(e.id,e.i,e.n);break;
      case 'endloop':setLoopBadge(e.id,0,0);break;
      case 'call':markCall(e.id,true);await sleep(spd*.4);break;
      case 'ret':markCall(e.id,false);break;
      case 'move':markRun(e.id);await animMove(e,spd);break;
      case 'pick':markRun(e.id);await animPick(e,spd);break;
      case 'skip':markRun(e.id);SFX.skip();await sleep(spd*.55);break;
      case 'bump':markRun(e.id);await animBump(e);markErr(e.id);break;
      case 'nostar':markRun(e.id);await animNoStar(e);markErr(e.id);break;
    }
  }
}
function markRun(id){$$('#prog .card.run').forEach(e=>{if(!e.classList.contains('calling'))e.classList.remove('run')});const el=$(`#prog [data-id="${id}"]`);if(el){el.classList.add('run');el.scrollIntoView({block:'nearest',inline:'nearest'})}}
function markErr(id){const el=$(`#prog [data-id="${id}"]`);if(el){el.classList.remove('run');el.classList.add('err')}}
function markCall(id,on){const el=$(`#prog [data-id="${id}"]`);if(el){el.classList.toggle('calling',on);el.classList.toggle('run',on)}const f=$('#prog .s-fn');f&&f.classList.toggle('active',on)}
function setLoopBadge(id,i,n){const b=$(`#prog [data-lcount="${id}"]`),lp=$(`#prog [data-loop="${id}"]`);const L=locate(id);if(b)b.textContent=i?tx(`รอบ ${i}/${n}`,`Turn ${i}/${n}`):'×'+(L?L.nd.n:'');lp&&lp.classList.toggle('looping',!!i)}
function clearRun(){$$('#prog .run,#prog .err,#prog .calling').forEach(e=>e.classList.remove('run','err','calling'));$$('#prog .looping').forEach(e=>e.classList.remove('looping'));$$('#prog [data-lcount]').forEach(b=>{const L=locate(b.dataset.lcount);if(L)b.textContent='×'+L.nd.n});const f=$('#prog .s-fn');f&&f.classList.remove('active')}
async function animMove(e,spd){
  const h=$('#hero');const dx=e.x-P.hero.x;moveHeroTo(e);if(!h)return;
  if(dx<0)h.classList.add('left');else if(dx>0)h.classList.remove('left');

}
async function animBump(e){

  if(hb&&hb.animate)hb.animate([{transform:'translate(0,0)'},{transform:`translate(${e.dx*30}%,${e.dy*30}%)`,offset:.4},{transform:'translate(0,0)'}],{duration:380,easing:'ease-out'});
  puff(e.x+e.dx*.5,e.y+e.dy*.5,'!');await sleep(460);

async function animPick(e,spd){

async function animNoStar(e){

function puff(x,y,txt){const e=$('#ents');if(!e)return;const d=document.createElement('div');d.className='ent puff';d.style.setProperty('--x',x);d.style.setProperty('--y',y);d.innerHTML=`<span>${txt}</span>`;e.appendChild(d);setTimeout(()=>d.remove(),1000)}

function onFail(r){
  P.fails++;if(!P.lv.custom){S.tries[P.lv.id]=(S.tries[P.lv.id]||0)+1;statRun(P.lv,false);save()}
  const rnd=P.m.rand.length>0;let id;

  const me=P,n=countProg(P.prog);let st=3,prev=0;

function openHint(){
  if(!P||P.running)return;const f=P.fails,lv=P.lv,stage=f>=5?3:f>=3?2:1;

/* ---------- สร้างด่านเอง ----------
   แผนที่ในลิงก์: o ว่าง · w กำแพง · s ดาว · q ดาวสุ่ม · h ตัวละคร · c น้องหมา (แถวคั่นด้วย -) */
const ED_TOOLS=[{k:'H',get name(){return tx('ตัวเรา','Hero')}},{k:'C',get name(){return tx('น้องหมา','Dog')}},{k:'#',get name(){return tx('กำแพง','Wall')}},{k:'*',get name(){return tx('ดาว','Star')}},{k:'?',get name(){return tx('ดาวสุ่ม','? Star')}},{k:'.',get name(){return tx('ลบ','Erase')}}];
const TIERS=[{n:1,get name(){return tx('ง่าย','Easy')}},{n:2,get name(){return tx('ทำซ้ำ','Repeat')}},{n:3,get name(){return tx('เก่ง','Expert')}}];
const ED_SIZES=[[4,3],[5,4],[6,5],[7,6]];
const ENC={'.':'o','#':'w','*':'s','?':'q','H':'h','C':'c'},DEC=Object.fromEntries(Object.entries(ENC).map(([a,b])=>[b,a]));
let E=null;
function newEd(w=5,h=4,theme=1,tier=1){const g=Array.from({length:h},()=>Array(w).fill('.'));g[h-1][0]='H';g[0][w-1]='C';return {w,h,g,tool:'#',theme,tier}}
function edOk(o){try{return o&&o.w>=3&&o.w<=7&&o.h>=2&&o.h<=6&&Array.isArray(o.g)&&o.g.length===o.h&&o.g.every(r=>Array.isArray(r)&&r.length===o.w&&r.every(c=>c in ENC))&&o.theme>=1&&o.theme<=8&&o.tier>=1&&o.tier<=3}catch(e){return false}}
const edRows=()=>E.g.map(r=>r.join(''));
function encodeLevel(rows,theme,tier,par){return `1.${theme}.${tier}.${rows[0].length}x${rows.length}.${par}.${rows.map(r=>[...r].map(c=>ENC[c]).join('')).join('-')}`}
function decodeLevel(code){try{const p=String(code).split('.');if(p.length!==6||p[0]!=='1')return null;
  const theme=+p[1],tier=+p[2],wh=p[3].split('x').map(Number),w=wh[0],h=wh[1],par=+p[4];
  if(!(theme>=1&&theme<=8&&tier>=1&&tier<=3&&w>=3&&w<=7&&h>=2&&h<=6&&par>=1&&par<=60))return null;
  const rows=p[5].split('-').map(r=>[...r].map(c=>DEC[c]||'!').join(''));
  if(rows.length!==h||rows.some(r=>r.length!==w||r.includes('!')))return null;
  const all=rows.join(''),cnt=ch=>all.split(ch).length-1;if(cnt('H')!==1||cnt('C')!==1||cnt('?')+cnt('*')>8)return null;
  if(mapCheck(rows,tier))return null;
  return {theme,tier,w,h,par,rows}}catch(e){return null}}
function customLevel(rows,theme,tier,o){
  const m=parseMap(rows),q=m.rand.length>0,st=m.stars.size>0,cards=['U','D','L','R'];
  if(st||q)cards.push('P');if(q)cards.push('I');if(tier>=2)cards.push('loop');if(tier>=3)cards.push('F');
  const solP=o.sol?checkSol(o.sol,m,cards):null;
  const par=o.par?(solP?countProg(solP):o.par):null;
  return {custom:o.mode,own:!!o.own,id:'custom',code:o.code||null,by:o.by||'',map:rows,m,w:WORLDS[theme-1],wi:theme-1,li:-1,idx:-1,theme,tier,cards,par,solP,kind:q?'random':st?'collect':'go'};
}
/* เฉลยในลิงก์ต้องใช้แต่การ์ดที่ด่านนี้มี เขียนถูกแบบ และชนะได้จริงทุกแบบที่ดาวสุ่มโผล่ */
function checkSol(str,m,cards){
  if(!/^[UDLRPIF2-6()|]{1,80}$/.test(str))return null;
  try{const sp=parseSol(str);if(toSol(sp.main)+(sp.fn.length?'|'+toSol(sp.fn):'')!==str.replace(/\|$/,''))return null;
    const ok=(list,inLoop,inFn)=>list.every(n=>n.t==='loop'?cards.includes('loop')&&!inLoop&&n.n>=2&&n.n<=6&&ok(n.body,true,inFn):n.t==='F'?cards.includes('F')&&!inFn:cards.includes(n.t));
    if(!sp.main.length||!ok(sp.main,false,false)||!ok(sp.fn,false,true))return null;
    return evaluate(m,sp).ok?sp:null}catch(e){return null}
}
function segs(m,a,b){/* จำนวนช่วงทางตรงที่น้อยที่สุดจาก a ไป b */
  const [ax,ay]=a.split(',').map(Number),best=new Map(),dq=[];
  for(const mv in MOVES){dq.push([ax,ay,mv,1])}
  while(dq.length){const [x,y,mv,c]=dq.shift(),nx=x+MOVES[mv][0],ny=y+MOVES[mv][1],nk=nx+','+ny;
    if(nx<0||ny<0||nx>=m.w||ny>=m.h||m.walls.has(nk))continue;const sk=nk+mv;if(best.has(sk)&&best.get(sk)<=c)continue;best.set(sk,c);
    if(nk===b)continue;for(const m2 in MOVES){if(m2===mv)dq.unshift([nx,ny,m2,c]);else dq.push([nx,ny,m2,c+1])}}
  let r=Infinity;for(const mv in MOVES){const v=best.get(b+mv);if(v!=null&&v<r)r=v}return r}
function bfsDist(m,from){const d=new Map([[from,0]]),q=[from];while(q.length){const k=q.shift(),[x,y]=k.split(',').map(Number);for(const mv in MOVES){const nx=x+MOVES[mv][0],ny=y+MOVES[mv][1],nk=nx+','+ny;if(nx<0||ny<0||nx>=m.w||ny>=m.h||m.walls.has(nk)||d.has(nk))continue;d.set(nk,d.get(k)+1);q.push(nk)}}return d}
/* ตรวจด่านที่สร้าง: ต้องมีครบ เดินถึงทุกอย่าง และไม่ยาวเกินจำนวนการ์ดที่วางได้ (คืนรหัสเสียงพากย์) */
function mapCheck(rows,tier){
  const m=parseMap(rows);if(!m.hero||!m.cat)return 'ed_need';
  if(m.stars.size+m.rand.length>8)return 'ed_max';
  const start=m.hero.x+','+m.hero.y,cat=m.cat.x+','+m.cat.y,d0=bfsDist(m,start);
  if(!d0.has(cat))return 'ed_block';
  const targets=[...m.stars,...m.rand];if(targets.some(k=>!d0.has(k)))return 'ed_far';
  /* ประมาณจำนวนการ์ด: เดินไปดาวที่ใกล้สุดทีละดวง (+1 ใบต่อดาว) แล้วไปหาน้องหมา; ชุดทำซ้ำนับทางตรงแต่ละช่วงไม่เกิน 2 ใบ */
  const est=t=>{const leg=(a,b)=>{const d=bfsDist(m,a).get(b);if(t<2||d<3)return d;return Math.min(d,2*segs(m,a,b))};
    let cur=start,left=targets.slice(),cards=0;
    while(left.length){const d=bfsDist(m,cur);left.sort((a,b)=>d.get(a)-d.get(b));const nx=left.shift();cards+=leg(cur,nx)+1;cur=nx}
    return cards+leg(cur,cat)};
  if(est(tier)>36)return tier<2&&est(2)<=36?'ed_long':'ed_long2';
  return null;
}

function edResize(w,h){

function openPublished(n,fresh){
